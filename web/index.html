<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentos | Alejandro Sagner SpA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--azul:#36454F;--dorado:#B19461;--claro:#EBEBEB;--gris:#708090;--tinta:#23303a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--claro);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  nav{background:var(--azul);height:60px;display:flex;align-items:center;padding:0 40px;position:relative;}
  nav::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--dorado) 30%,transparent 30%);}
  nav img{height:34px;width:auto;}
  .wrap{max-width:720px;margin:0 auto;padding:48px 24px 80px;flex:1;}
  .page-title{font-family:'Playfair Display',serif;font-size:26px;color:var(--azul);margin-bottom:6px;}
  .page-sub{font-size:13px;color:var(--gris);margin-bottom:32px;}
  .set-card{background:#fff;border:1px solid #d8d8d8;display:flex;align-items:center;gap:20px;padding:20px 24px;text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s;}
  .set-card:hover{box-shadow:0 6px 20px rgba(9,14,16,.1);transform:translateY(-1px);}
  .set-num{flex:0 0 36px;height:36px;width:36px;background:var(--azul);color:#fff;font-family:'Playfair Display',serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .set-info{flex:1;}
  .set-type{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dorado);margin-bottom:3px;}
  .set-title{font-size:15px;font-weight:600;color:var(--azul);margin-bottom:2px;}
  .set-meta{font-size:12px;color:var(--gris);}
  .set-arrow{color:var(--gris);font-size:18px;}
  footer{background:var(--azul);padding:18px 40px;font-size:11px;color:rgba(255,255,255,.4);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  footer a{color:rgba(255,255,255,.55);text-decoration:none;}
  @media(max-width:600px){nav{padding:0 20px;}.wrap{padding:28px 16px 60px;}footer{padding:16px 20px;}}
</style>
</head>
<body>
<nav>
  <img src="assets/logos/Alejandro-Sagner-Logo-Horizontal-FondosOscuros.svg" alt="Alejandro Sagner SpA">
</nav>
<div class="wrap">
  <h1 class="page-title">Documentos</h1>
  <p class="page-sub">Alejandro Sagner SpA · Repositorio de entregables y expedientes</p>

  <a href="iso14001/" class="set-card">
    <div class="set-num">1</div>
    <div class="set-info">
      <div class="set-type">Gestión ambiental</div>
      <div class="set-title">Expediente ISO 14001 — Electrans</div>
      <div class="set-meta">4 documentos · v1a · Junio 2026</div>
    </div>
    <span class="set-arrow">→</span>
  </a>
</div>
<footer>
  <span>Alejandro Sagner SpA · RUT 77.704.639-K · contacto@alejandrosagner.com</span>
  <a href="https://www.alejandrosagner.com">alejandrosagner.com</a>
</footer>
</body>
</html>
